name: Peer of the day

on:
  schedule:
    # The 18:00 run backfills automatically if the noon run failed.
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-peer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Generate the peer of the day
        id: gen
        run: |
          seed=$(date -u +%F)
          node dist/cli.js --seed "$seed" --length 0.9 -o "titulary-$seed.txt"
          node dist/cli.js --seed "$seed" --length 0.9 -f html -o "titulary-$seed.html"
          node dist/cli.js --seed "$seed" --length 0.1 > title.txt
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
      - name: Skip if already published today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ steps.gen.outputs.seed }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && gh release view "daily-$SEED" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        if: steps.check.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ steps.gen.outputs.seed }}
        run: |
          title=$(head -c 250 title.txt)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh release delete "daily-$SEED" --yes --cleanup-tag 2>/dev/null || true
          fi
          for i in 1 2 3; do
            gh release create "daily-$SEED" \
              --title "$title" \
              --notes "Peer of the day, seed \`$SEED\`. Reproduce them at https://mithrilbytes.github.io/titulary/?seed=$SEED&length=0.9" \
              "titulary-$SEED.txt" "titulary-$SEED.html" && break
            echo "release attempt $i failed; retrying in 20s"
            sleep 20
          done
          gh release view "daily-$SEED" >/dev/null
      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Peer of the day workflow failed"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "See $url. The 18:00 UTC run retries automatically."
          fi
